envVarGroups:
  - name: kalibr-reports-free-pilot
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Tashkent
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AMOCRM_BASE_URL
        value: https://kalibrbooks.amocrm.ru
      - key: AMOCRM_ACCESS_TOKEN
        sync: false

services:
  - type: web
    name: kalibr-reports-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    dockerCommand: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - fromGroup: kalibr-reports-free-pilot
      - key: DATABASE_URL
        fromDatabase:
          name: kalibr-reports-db
          property: connectionString

databases:
  - name: kalibr-reports-db
    plan: free
    databaseName: kalibr_reports
    user: kalibr_reports
